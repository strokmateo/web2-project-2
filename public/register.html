<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registracija · Sigurnosne ranjivosti</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-layout">
  <header class="topbar">
    <h1>Sigurnosne ranjivosti web-aplikacija</h1>
  </header>

  <main class="auth-page">
    <section class="card">
      <h2>Registracija</h2>
      <form id="auth-form" class="auth-form" data-endpoint="/api/auth/register">
        <label>Korisničko ime <input name="username" autocomplete="username" required></label>
        <label>Lozinka <input name="password" type="password" autocomplete="new-password" required></label>
        <button type="submit">Registriraj se</button>
      </form>
      <p id="auth-message" class="message"></p>
      <p class="hint">Već imate račun? <a href="/login">Prijavite se</a></p>
    </section>
  </main>

  <script type="module" src="/js/auth.js"></script>
</body>
</html>
