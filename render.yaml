# Render Blueprint: creates the Postgres database and the Docker web service.
# Render dashboard -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: vuln-demo
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vuln-demo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false # asked for when the blueprint is created

databases:
  - name: vuln-demo-db
    plan: free
